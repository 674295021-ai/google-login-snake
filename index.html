<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Neon Snake Game - Supabase</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap');
    
    * {
      font-family: 'Kanit', sans-serif;
    }

    .glassmorphism {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .neon-border {
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
    }

    .neon-text-green {
      text-shadow: 0 0 8px rgba(74, 222, 128, 0.8);
    }

    .neon-text-purple {
      text-shadow: 0 0 8px rgba(192, 132, 252, 0.8);
    }

    canvas {
      background: rgba(15, 23, 42, 0.7);
      border: 2px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 min-h-screen flex items-center justify-center p-4 text-white">

  <!-- Main Container -->
  <div class="glassmorphism rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl border border-white/10 my-6 transition-all duration-300">
    
    <!-- State 1: ยังไม่ได้เข้าสู่ระบบ -->
    <div id="login-section" class="space-y-6 text-center py-8">
      <div class="relative w-20 h-20 mx-auto">
        <div class="absolute inset-0 bg-purple-500 rounded-full blur-xl opacity-50 animate-pulse"></div>
        <div class="relative w-20 h-20 bg-white/10 rounded-2xl flex items-center justify-center border border-white/20">
          <svg class="w-10 h-10 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.39-2.823-1.07-4"></path>
          </svg>
        </div>
      </div>

      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white mb-2">เข้าสู่ระบบ</h1>
        <p class="text-slate-300 text-sm">เข้าสู่ระบบด้วย Google เพื่อเริ่มเล่นเกม Neon Snake</p>
      </div>

      <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-100 text-slate-900 font-semibold py-3.5 px-4 rounded-xl transition-all duration-200 shadow-lg hover:shadow-white/20 active:scale-[0.98]">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <!-- State 2: เข้าสู่ระบบสำเร็จแล้ว (Game Dashboard) -->
    <div id="user-info" class="hidden space-y-5">
      <!-- User Profile Header -->
      <div class="flex items-center justify-between bg-white/5 p-3.5 rounded-2xl border border-white/10">
        <div class="flex items-center gap-3">
          <img id="avatar" class="w-12 h-12 rounded-full border-2 border-purple-400/50 shadow-md object-cover" src="" alt="Profile">
          <div>
            <div class="flex items-center gap-2">
              <h2 id="user-name" class="font-bold text-white text-base leading-tight"></h2>
              <span class="bg-emerald-500/20 text-emerald-400 text-[10px] font-semibold px-2 py-0.5 rounded-full border border-emerald-500/30">Online</span>
            </div>
            <p id="user-email" class="text-xs text-slate-400 mt-0.5"></p>
          </div>
        </div>
        <button onclick="logout()" class="text-xs bg-red-500/20 hover:bg-red-500/40 text-red-300 hover:text-white px-3 py-1.5 rounded-lg border border-red-500/30 transition-all">
          ออกระบบ
        </button>
      </div>

      <!-- Game Title & Stats -->
      <div class="flex items-center justify-between px-1">
        <div>
          <h3 class="text-lg font-bold text-purple-300 neon-text-purple">🐍 NEON SNAKE</h3>
          <p class="text-xs text-slate-400">ใช้ปุ่มลูกศร หรือปุ่มบนหน้าจอควบคุม</p>
        </div>
        <div class="flex gap-3 text-right">
          <div class="bg-slate-900/60 px-3 py-1.5 rounded-xl border border-white/10">
            <p class="text-[10px] text-slate-400 uppercase">Score</p>
            <p id="score" class="text-base font-bold text-green-400 neon-text-green">0</p>
          </div>
          <div class="bg-slate-900/60 px-3 py-1.5 rounded-xl border border-white/10">
            <p class="text-[10px] text-slate-400 uppercase">High Score</p>
            <p id="high-score" class="text-base font-bold text-purple-400">0</p>
          </div>
        </div>
      </div>

      <!-- Canvas Area -->
      <div class="relative flex justify-center items-center">
        <canvas id="gameCanvas" width="360" height="360" class="rounded-2xl"></canvas>
        
        <!-- Game Over / Start Overlay -->
        <div id="game-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center border border-purple-500/30">
          <h4 id="overlay-title" class="text-2xl font-extrabold text-white mb-1">พร้อมเล่นหรือยัง?</h4>
          <p id="overlay-msg" class="text-xs text-slate-300 mb-5">บังคับงูเก็บอาหารเนออนเพื่อสะสมคะแนน!</p>
          <button id="start-btn" onclick="startGame()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-purple-600/40 transition-all active:scale-95">
            เริ่มเกมทันที 🚀
          </button>
        </div>
      </div>

      <!-- Mobile On-Screen D-Pad -->
      <div class="pt-2">
        <div class="grid grid-cols-3 gap-2 max-w-[200px] mx-auto">
          <div></div>
          <button onclick="changeDir('UP')" class="bg-white/10 hover:bg-white/20 active:bg-purple-600 text-white p-3 rounded-xl border border-white/10 flex items-center justify-center font-bold">▲</button>
          <div></div>
          <button onclick="changeDir('LEFT')" class="bg-white/10 hover:bg-white/20 active:bg-purple-600 text-white p-3 rounded-xl border border-white/10 flex items-center justify-center font-bold">◀</button>
          <button onclick="changeDir('DOWN')" class="bg-white/10 hover:bg-white/20 active:bg-purple-600 text-white p-3 rounded-xl border border-white/10 flex items-center justify-center font-bold">▼</button>
          <button onclick="changeDir('RIGHT')" class="bg-white/10 hover:bg-white/20 active:bg-purple-600 text-white p-3 rounded-xl border border-white/10 flex items-center justify-center font-bold">▶</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    // Config Supabase
    const SUPABASE_URL = 'https://ezugolwoudtudpqlbwha.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PqOmnRo0gThCp1qAF_ZDRw_KQ8zNrE6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // OAuth Login
    async function loginWithGoogle() {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + window.location.pathname
        }
      });
      if (error) console.error('Login Error:', error.message);
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const user = session.user;
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('user-info').classList.remove('hidden');
        document.getElementById('user-name').innerText = user.user_metadata.full_name || 'User';
        document.getElementById('user-email').innerText = user.email;
        document.getElementById('avatar').src = user.user_metadata.avatar_url || 'https://via.placeholder.com/150';
        initCanvas();
      }
    }

    checkUser();

    // --- Snake Game Logic ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const grid = 18; // 360 / 18 = 20 cells
    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = grid;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    let gameInterval = null;
    let isRunning = false;

    document.getElementById('high-score').innerText = highScore;

    function initCanvas() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function startGame() {
      document.getElementById('game-overlay').classList.add('hidden');
      snake = [
        { x: grid * 5, y: grid * 5 },
        { x: grid * 4, y: grid * 5 },
        { x: grid * 3, y: grid * 5 }
      ];
      dx = grid;
      dy = 0;
      score = 0;
      document.getElementById('score').innerText = score;
      generateFood();
      isRunning = true;

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 110);
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
      food.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
    }

    function gameLoop() {
      if (!isRunning) return;

      // Calculate next position
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Check wall collision
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        gameOver();
        return;
      }

      // Check self collision
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Check food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake_highscore', highScore);
          document.getElementById('high-score').innerText = highScore;
        }
        generateFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear Background
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines (Subtle)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      for (let i = 0; i < canvas.width; i += grid) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food (Neon Pink Circle)
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ec4899';
      ctx.fillStyle = '#f472b6';
      ctx.beginPath();
      ctx.arc(food.x + grid / 2, food.y + grid / 2, grid / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          // Snake Head (Bright Neon Green)
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#22c55e';
          ctx.fillStyle = '#4ade80';
        } else {
          // Snake Body
          ctx.shadowBlur = 5;
          ctx.shadowColor = '#16a34a';
          ctx.fillStyle = '#22c55e';
        }
        ctx.fillRect(segment.x + 1, segment.y + 1, grid - 2, grid - 2);
      });

      // Reset Shadow for next render
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameInterval);
      document.getElementById('overlay-title').innerText = 'Game Over! 💥';
      document.getElementById('overlay-msg').innerText = `คุณทำคะแนนได้: ${score} คะแนน`;
      document.getElementById('start-btn').innerText = 'เล่นอีกครั้ง 🔄';
      document.getElementById('game-overlay').classList.remove('hidden');
    }

    function changeDir(dir) {
      if (!isRunning) return;
      if (dir === 'UP' && dy === 0) { dx = 0; dy = -grid; }
      if (dir === 'DOWN' && dy === 0) { dx = 0; dy = grid; }
      if (dir === 'LEFT' && dx === 0) { dx = -grid; dy = 0; }
      if (dir === 'RIGHT' && dx === 0) { dx = grid; dy = 0; }
    }

    // Keyboard Controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') changeDir('UP');
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') changeDir('DOWN');
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeDir('LEFT');
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeDir('RIGHT');
    });
  </script>
</body>
</html>
